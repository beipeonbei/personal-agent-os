# Agent 角色定义（Agent Config Sync 载体）
# 规范见 agent-schema.md；任何修改必须提交仓库，另一端 pull 后生效。
# 2026-10-22 更新（轨 A 阶段 4a）：coding 转 active；research/ops host 由 tbd 改为 hermes；
# 每个 reserved 项补 activation_condition（有触发条件，不再是空占位）。
# 在岗：chief、coding（2/5）。其余 3 个保留待激活。

agents:
  - id: chief
    name: Chief Agent
    role: chief
    status: active            # active = 在岗；reserved = 定义预留
    host: m365-copilot        # 承载组件（Office Node；Home Node 由 hermes 代行）
    entry: true               # 唯一日常入口
    responsibilities:
      - 日常唯一入口与主脑
      - 任务理解与派发（派发给 OpenHands / 各执行 Agent）
      - 跨节点工作的发起与验收
    tools:
      - obsidian              # 读写 Vault
      - github                # 仓库操作
    policy:
      single_entry: true      # 禁止与其他入口并行提问
      memory_write: via-vault # 记忆写入只走 Vault 通道

  - id: research
    name: Research Agent
    role: research
    status: reserved
    host: hermes              # 已明确承载（原 tbd）
    activation_condition: >-
      Hermes 常驻运行且已接入检索渠道；Browser MCP 接入完成（MCP Foundation 在
      Kernel Readiness YES 之后）。满足前保持 reserved，不伪造为可用。
    responsibilities:
      - 检索与调研
      - 资料汇总与线索索引（落 Vault/Research）
    tools:
      - browser-mcp           # 依赖 MCP 接入，见 ../MCP/mcp-plan.md
      - obsidian
    policy:
      source_traceable: true  # 结论必须可溯源

  - id: coding
    name: Coding Agent
    role: coding
    status: active            # 2026-10-22 转在岗：由 OpenHands 实际承担
    host: openhands           # 经 OpenHands 执行中心落地
    responsibilities:
      - 编码执行（Projects/ 范围内）
      - 按 Chief 派发的任务单自主执行并交付
    tools:
      - filesystem
      - git
      - openhands-sandbox
    policy:
      workspace: D:/Personal-Agent-OS/Projects
      log_to: D:/Personal-Agent-OS/Logs

  - id: browser
    name: Browser Agent
    role: browser
    status: reserved
    host: openhands
    activation_condition: >-
      Browser MCP 实际接入并有可用浏览器运行时；MCP Foundation 排在
      Kernel Readiness YES 之后，此前不激活。
    responsibilities:
      - 浏览器任务（依赖 Browser MCP）
      - 网页信息采集与结构化摘录
    tools:
      - browser-mcp
    policy:
      no_credential_storage: true

  - id: ops
    name: Ops Agent
    role: ops
    status: reserved
    host: hermes              # 已明确承载（原 tbd）
    activation_condition: >-
      Execution Broker 建成且 Task/Decision/Snapshot/Log 有统一写入入口后激活；
      Broker 未建成前由人工调用 Config/scripts 下的只读脚本代替。
    responsibilities:
      - 同步巡检（OneDrive 冲突、Git 状态）
      - 配置治理与日志巡检
      - 双节点一致性检查（目录树比对）
    tools:
      - filesystem
      - git
    policy:
      read_only_default: true # 默认只读，修复动作需 Chief 派发
