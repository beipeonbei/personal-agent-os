# Personal Agent OS — 系统状态固化文件
# 本文件是系统当前状态的机器可读快照；随 GitHub 同步，双节点一致。
# 变更纪律：任何组件状态变化时先改本文件再提交；状态值取自实测，不写推测。

version: beta-0.9
last_verified: 2026-10-20

chief_agent:
  component: M365 Copilot
  status: ready
  role: 唯一日常入口 / 主脑 / 任务派发
  node: office（公司环境）+ home（可用）
  single_entry: true

memory_layer:
  manager: Hermes Agent v0.21.7
  manager_status: running          # 2026-10-20 实测：5 个进程
  memory_source:                   # Hermes 侧记忆存储
    soul: C:/Users/Administrator/AppData/Local/hermes/SOUL.md
    memory: C:/Users/Administrator/AppData/Local/hermes/memories/MEMORY.md
    user: C:/Users/Administrator/AppData/Local/hermes/memories/USER.md
  authoritative: Obsidian Vault    # 冲突时 Vault 赢
  vault_anchor: Vault/AgentOS/identity.md
  export_dir: Vault/AgentOS/memory-export
  knowledge_source: Obsidian Vault # 六目录：Inbox/Projects/Research/AgentOS/Startup/Daily
  status: ready

runtime_layer:
  component: DeepSeek Harness (dsh) 0.1.1-rc.2
  status: degraded                 # 服务在线，模型连接不可用
  webui: http://127.0.0.1:8080
  webui_status: up                 # 2026-10-20 实测：端口监听
  api_key_status: invalid          # 401：key 失效，用户动作（充值/换 key）
  autostart_task: DSH-DeepSeekHarness
  autostart_state: Ready
  blocked_by: deepseek_api_key

execution_layer:
  component: OpenHands (ghcr.io/openhands/agent-canvas:1.27.1)
  container: openhands
  status: up                       # 2026-10-20 实测：Up 8 hours
  canvas: http://localhost:8000/canvas
  canvas_status: 200
  restart_policy: unless-stopped
  mounts:
    - D:/Personal-Agent-OS -> /projects
    - C:/Users/Administrator/.openhands -> /home/openhands/.openhands
  engine: Docker Desktop 29.8.2

knowledge_layer:
  component: Obsidian
  vault: D:/Personal-Agent-OS/Vault
  vault_dirs: [Inbox, Projects, Research, AgentOS, Startup, Daily]
  templates: Vault/AgentOS/templates
  sync: OneDrive + Git 双轨
  status: ready

gitops_layer:
  component: GitHub
  repo: personal-agent-os
  url: https://github.com/beipeonbei/personal-agent-os
  branch: main
  commit_prefix: "[home] / [office]"
  last_commit: 58ecf3d
  status: ready

node_state:
  home:
    node_id: home
    status: online
    components: [git, github, obsidian, docker, openhands, hermes, dsh, vscode, cursor, codebuddy]
  office:
    node_id: office
    status: not_deployed           # Phase 1.5 未执行
    components: []

blocking_items:
  - id: deepseek_api_key
    layer: runtime_layer
    description: DeepSeek API key 失效（401），DSH 无法连接模型
    owner: user
    action: 充值或换新 key，更新 DEEPSEEK_API_KEY 后重启 DSH
  - id: office_node_not_deployed
    layer: node_state
    description: Office Node 未部署，双节点尚未成立
    owner: user_onsite
    action: 按 Docs/Integration-Plans.md Phase 1.5 在公司电脑执行

# 代码库审计追踪（来源：Docs/Codebase-Audit-20261021.md；方案：Docs/Full-Run-Plan-v2.md）
audit:
  date: 2026-10-21
  verdict: 分层合理，但缺可执行物 / 可追溯物 / 已接物件三类
  weakness_count: 12
  weaknesses:
    - {id: W1,  kind: coverage,    item: 零自动化脚本,           target: 五个脚本可独立运行并输出 PASS/FAIL, stage: 1, status: PLANNED}
    - {id: W2,  kind: coverage,    item: Vault 六目录空壳,       target: 五个空目录各有至少一篇真实笔记,     stage: 3, status: PLANNED}
    - {id: W3,  kind: coverage,    item: Logs 零运行日志,        target: 按日归档的真实运行记录,             stage: 3, status: PLANNED}
    - {id: W4,  kind: structure,   item: MCP 只有计划零接入,     target: 至少 2 个 MCP 配置落库且可用,       stage: 4, status: PLANNED}
    - {id: W5,  kind: structure,   item: Agent Team 仅 1/5 在岗, target: active 至少 2 个且 reserved 有激活条件, stage: 4, status: PLANNED}
    - {id: W6,  kind: structure,   item: 占位目录无实质配置,     target: 三目录各有可照抄的运行清单,         stage: 2, status: PLANNED}
    - {id: W7,  kind: improvement, item: Portal 状态模糊,        target: 标注 SPEC_FROZEN 与触发条件,        stage: 4, status: PLANNED}
    - {id: W8,  kind: improvement, item: 无验证/测试/CI,         target: verify-system.ps1 一键输出一致性报告, stage: 1, status: PLANNED}
    - {id: W9,  kind: improvement, item: 无备份机制,             target: 备份可执行且带文件数校验,           stage: 1, status: PLANNED}
    - {id: W10, kind: improvement, item: 运行沉淀极浅,           target: 形成每日 pull/push 与日志节奏,      stage: ongoing, status: PLANNED}
    - {id: W11, kind: coverage,    item: Projects 近乎空,        target: 产出按主题归档到 Projects/<topic>/,  stage: ongoing, status: PLANNED}
    - {id: W12, kind: improvement, item: PowerShell 5.1 中文编码隐患, target: 脚本纯 ASCII 注释，运行显示正常, stage: 1, status: PLANNED}
  maturity_projection: {current: 72, after_stage1_2: 78, after_stage3_4: 84, after_stage5: 92, after_stage6: 96}
  next_stage: 1（自律脚本，无外部依赖，确认即开工）

# 架构对齐（来源：Docs/Architecture-Gap-Analysis.md）
alignment:
  date: 2026-10-21
  target_architecture_source: Home Node Master Execution Directive（Stage 5 指令）
  target_architecture_status: TARGET_NOT_CURRENT   # 目标架构，非仓库现状
  stage5_status: PAUSED                            # 地基缺失，暂停执行
  foundation_status:
    constitution: MISSING
    taskstore: MISSING
    event_ledger: MISSING      # 全库 .jsonl = 0
    decision_ledger: MISSING
    snapshot: MISSING
    gates: MISSING             # L92 / A1-A4，0 命中
    invariants: MISSING        # I-1 / I-4 / I-5 / I-6 / I-7，0 命中
  identity_binding_files:
    USER.md: PRESENT
    GOALS.md: MISSING
    RULES.md: MISSING
  route_candidates: [A_kernel_first, B_v2_continue, C_dual_track]
  route_recommendation: C_dual_track
  conflicts:
    - {id: C-1, kind: numbering, detail: v2 阶段 5/8/9 与目标 Stage 5/8/9 同名异义, resolution: MERGED, decision: v2 阶段 N 改称轨 A 阶段 N，附 Stage 对照表}
    - {id: C-2, kind: ordering,  detail: v2 先接 MCP vs 目标 Kernel YES 后才做 MCP, resolution: TARGET_ORDER, decision: MCP 排在 Kernel Readiness YES 之后；v2 阶段 4 拆为 4a（配置，第一轨可做）/ 4b（MCP 接入，推迟）}
    - {id: C-3, kind: write,     detail: memory-export 直写 Vault（权威源），须先立规则与签名, resolution: DIRECT_WRITE_KEPT, decision: 用户裁决维持直写；附四条补偿纪律，状态标 PARTIAL, risk: 签名机制落地前写入不可追溯，历史导出无法补签}
    - {id: C-4, kind: ordering,  detail: v2 阶段 6 派发链与 Execution Broker 统一入口重叠，先建派发链将形成双入口, resolution: PENDING, decision: 建议推迟到 Broker 之后，待用户确认}
    - {id: C-5, kind: write,     detail: v2 阶段 5 移动 Vault 真实内容至 OneDrive 并 junction 回指，属权威源物理位置变更，快照签名缺失时完整性无从校验, resolution: PENDING, decision: 建议排在账本 schema 之后，或执行前后各做全量校验，待用户确认}
  decisions:                     # 2026-10-22 用户逐项裁决；来源 Docs/Architecture-Alignment-Decision.md
    date: 2026-10-22
    decided_by: user
    decision_doc: Docs/Architecture-Alignment-Decision.md
    route: C_dual_track
    constitution_basis: identity.md + 诚实纪律演进（不另起独立宪法）
    constitution_target: Vault/AgentOS/CONSTITUTION.md（待建，落点待用户确认）
    numbering: KEEP_ORIGINAL     # 沿用 L92 / A1-A4 / I-1~I-7，另附「编号 → 本仓库落点」对照表
    c3: DIRECT_WRITE_KEPT
  dual_track:
    track_1_engineering:         # 工程补齐，可立即开工
      scope: [轨A阶段1 五个自律脚本, 轨A阶段2 三目录落真运行清单, 轨A阶段3 Vault填充+日志约定, 轨A阶段4a roles补齐+Portal标注]
      boundary:
        - 不得写账本（events.jsonl / decisions.jsonl / snapshot）
        - 不得写权威源（identity.md / USER.md / GOALS.md / RULES.md）；例外仅 memory-export 目录
        - 不得建 Identity / Budget / Broker
        - health-check 与 verify-system 必须只读，仅输出 PASS/FAIL
        - 脚本纯 ASCII 注释（W12）
    track_2_governance:          # 治理地基，严格顺序，仅产出规则与 schema 文档
      order: [Constitution, TaskStore_Schema, ledger_schema, Gates(L92/A1-A4), Invariants(I-1~I-7), GOALS.md+RULES.md]
    convergence:                 # 两轨都到位后
      order: [identity_runtime, budget_runtime, execution_broker+authenticity, bypass_tests(全FAIL), kernel_readiness_review, portal/mcp_4b/multi_agent]
  forbidden_until_aligned:
    - identity_runtime          # 解禁：第二轨 1-5 步完成 + GOALS.md/RULES.md 存在
    - budget_runtime            # 解禁：同上
    - execution_broker          # 解禁：Identity 与 Budget Runtime 均建成
    - events.jsonl              # 解禁：第二轨 ledger schema 定案
    - decisions.jsonl           # 解禁：第二轨 ledger schema 定案
    - bypass_tests              # 解禁：Broker 与 Gate 真实存在且有可被绕过对象
    - marking_partial_as_enforced  # 永久禁止，非阶段性；Enforced 须满足四判据
  pending_decisions: [I-2/I-3 是否启用, C-4 处置, C-5 处置, CONSTITUTION.md 落点确认]
