# Home Node 配置（家里电脑）
# 本文件随 GitHub 仓库同步；node 标识用于提交信息前缀与双节点一致性检查。

node:
  id: home
  name: Home Node（家里电脑）
  role: 核心承载节点
  responsibilities:
    - Agent Runtime
    - Memory
    - 实验室
    - Portal 开发
    - 长期 Agent

components:
  m365_copilot: ready        # Chief Agent，唯一日常入口
  vscode: required
  git: required
  github_copilot: required
  obsidian: required
  openhands: required        # 待安装
  docker_desktop: required   # 必装，安装时启用 WSL2
  wsl2: required             # Home Node 专属
  cursor: recommended
  codebuddy: recommended
  hermes: not_installed      # 未来阶段（Q2），本节点优先部署
  deepseek_harness: not_installed  # 未来阶段（Q3），本节点优先部署

sync:
  knowledge:
    channel: onedrive        # Vault 经 OneDrive 同步
    vault_path: D:/Personal-Agent-OS/Vault
  gitops:
    channel: github
    repo: personal-agent-os
    commit_prefix: "[home]"
  memory: obsidian_single_source  # V1 单源；Hermes 部署后改为双层（方案 3.3）
  agent_config: github       # Agents/ 随仓库同步

entry:
  chief: m365_copilot
  single_entry: true         # 禁止多入口并行
